[project]
name = "heatpump-control"
version = "0.0.0"
description = "Spot-price controller for a Viessmann Vitocal 333-G"
requires-python = ">=3.12"
dependencies = [
    "paho-mqtt>=2.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/heatpump_control"]

[tool.pytest.ini_options]
testpaths = ["tests"]
